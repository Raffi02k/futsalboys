<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d0f" />
    <title>404 - Sidan hittades inte | Futsal Boys Trollhättan</title>
    <link rel="icon" type="image/png" href="/images/futsalboys-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        if (path && path !== '/404.html' && path !== '/404') {
          window.location.replace('/?p=' + encodeURIComponent(path));
        }
      })();
    </script>
    <style>
      :root {
        --bg-pitch: #07090b;
        --neon-green: #10ff60;
        --neon-glow: rgba(16, 255, 96, 0.45);
        --white: #ffffff;
        --silver-dim: #9da8b3;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --font-display: 'Bebas Neue', Impact, sans-serif;
        --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg-pitch);
        color: var(--white);
        font-family: var(--font-body);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        text-align: center;
        background-image: radial-gradient(circle at 50% 30%, rgba(16, 255, 96, 0.08) 0%, transparent 65%);
      }
      .container {
        max-width: 620px;
        width: 100%;
        margin: 0 auto;
      }
      .logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
        margin-bottom: 24px;
        filter: drop-shadow(0 0 16px rgba(16, 255, 96, 0.4));
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 16px;
        border-radius: 999px;
        background: rgba(16, 255, 96, 0.1);
        border: 1px solid rgba(16, 255, 96, 0.35);
        color: var(--neon-green);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }
      .error-code {
        font-family: var(--font-display);
        font-size: clamp(80px, 18vw, 150px);
        font-weight: 900;
        line-height: 0.9;
        color: var(--neon-green);
        text-shadow: 0 0 45px var(--neon-glow), 0 0 10px rgba(16, 255, 96, 0.5);
        letter-spacing: 0.04em;
        margin-bottom: 12px;
      }
      h1 {
        font-family: var(--font-display);
        font-size: clamp(28px, 5vw, 42px);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      h1 span {
        color: var(--neon-green);
      }
      p {
        color: var(--silver-dim);
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .btn-neon {
        background: var(--neon-green);
        color: #07090b;
        box-shadow: 0 0 20px rgba(16, 255, 96, 0.35);
      }
      .btn-neon:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(16, 255, 96, 0.5);
      }
      .btn-outline {
        background: transparent;
        color: var(--white);
        border: 1px solid var(--border-subtle);
      }
      .btn-outline:hover {
        border-color: var(--neon-green);
        color: var(--neon-green);
      }
      .insta-link {
        color: var(--neon-green);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        padding-top: 14px;
        border-top: 1px solid var(--border-subtle);
      }
      .insta-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="/images/futsalboys-logo.png" alt="Futsal Boys" class="logo" />
      <div>
        <span class="badge">OUT OF BOUNDS • BOLLEN UTANFÖR LINJEN</span>
      </div>
      <div class="error-code">404</div>
      <h1>SIDAN KUNDE INTE <span>HITTAS</span></h1>
      <p>
        Det ser ut som att länken du följde är felaktig eller att sidan har flyttats.<br />
        Ingen fara, matchen fortsätter! Välj vart du vill gå:
      </p>
      <div class="btn-grid">
        <a href="/" class="btn btn-neon">STARTSIDAN</a>
        <a href="/truppen" class="btn btn-outline">SPELARTRUPPEN</a>
        <a href="/matcher" class="btn btn-outline">SPELSCHEMA</a>
      </div>
      <a href="https://instagram.com/grabbarna.futsal" target="_blank" rel="noopener noreferrer" class="insta-link">
        Följ @grabbarna.futsal på Instagram →
      </a>
    </div>
  </body>
</html>
