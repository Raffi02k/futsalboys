<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Sidan hittades inte | 404</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0e1622;
        color: #f4f6f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .box {
        max-width: 500px;
        padding: 40px 24px;
      }
      h1 {
        font-size: 5rem;
        margin: 0;
        color: #e5b800;
        line-height: 1;
      }
      p {
        color: #9da1a7;
        font-size: 1.15rem;
        margin: 18px 0 28px;
      }
      a {
        display: inline-block;
        background: #5e8cd1;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 8px;
        font-weight: 600;
        transition: opacity 0.2s;
      }
      a:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>404</h1>
      <h2>Sidan kunde inte hittas</h2>
      <p>Sidan du söker finns inte eller har flyttats. Gå tillbaka till startsidan eller begär en offert.</p>
      <a href="/">Tillbaka till startsidan</a>
    </div>
  </body>
</html>
